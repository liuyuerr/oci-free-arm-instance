name: Try to Create OCI VM

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

env:
  COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
  IMAGE_ID: "ocid1.image.oc1.ap-singapore-1.aaaaaaaaaynzciw3t7fypsdqahuupzsvbv5ewlubquu3ksfqugxchksgxm4q"
  SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
  AD_NAME: "UEPz:AP-SINGAPORE-1-AD-1"
  OCI_CLI_REGION: "ap-singapore-1"

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Setup OCI CLI and try to create VM
        run: |
          pip install oci-cli

          mkdir -p ~/.oci
          echo "${{ secrets.OCI_CLI_KEY_CONTENT }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${{ secrets.OCI_CLI_USER }}
          tenancy=${{ secrets.OCI_CLI_TENANCY }}
          fingerprint=${{ secrets.OCI_CLI_FINGERPRINT }}
          key_file=~/.oci/oci_api_key.pem
          region=${{ env.OCI_CLI_REGION }}
          EOF

          echo "${{ secrets.SSH_PUBLIC_KEY }}" > /home/runner/my_ssh_key.pub

          OCI_OUTPUT=$(oci compute instance launch \
            --compartment-id "$COMPARTMENT_ID" \
            --availability-domain "$AD_NAME" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config '{"ocpus":4.0,"memoryInGBs":24.0}' \
            --subnet-id "$SUBNET_ID" \
            --image-id "$IMAGE_ID" \
            --ssh-authorized-keys-file "/home/runner/my_ssh_key.pub" \
            --assign-public-ip true \
            --display-name "oracle-a1-singapore" \
            2>&1 || true)

          echo "$OCI_OUTPUT"

          if echo "$OCI_OUTPUT" | grep -q '"lifecycle-state": "PROVISIONING"'; then
            echo "Success: instance is provisioning."
            exit 0
          fi

          echo "Instance not created."
          exit 1
